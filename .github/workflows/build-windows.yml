name: Build PulseForge for Windows

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Derive Windows application icons from the existing logo
        working-directory: app
        run: npm run tauri -- icon ../icon.png

      - name: Bundle FFmpeg executable
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey FFmpeg install failed." }
          $candidates = Get-ChildItem -Path "$env:ChocolateyInstall\lib" -Filter ffmpeg.exe -Recurse -File -ErrorAction SilentlyContinue
          $ffmpeg = $candidates | Where-Object { $_.FullName -match "ffmpeg" } | Select-Object -First 1
          if (-not $ffmpeg) { throw "Cannot find actual ffmpeg.exe after installation." }
          New-Item -Path app/src-tauri/bin -ItemType Directory -Force | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination app/src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe -Force
          & app/src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg executable failed smoke test." }

      - name: Build signed-off-free Windows NSIS installer
        working-directory: app
        run: npm run tauri -- build --bundles nsis

      - name: Verify installer output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter "*.exe" -File)
          if ($files.Count -eq 0) { throw "No NSIS installer produced." }
          $files | ForEach-Object { Write-Host "$($_.Name) ($($_.Length) bytes)" }

      - name: Upload installable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-Windows11-EXE
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows preview in GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer not found for preview release." }
          $tag = "windows-preview-${{ github.run_number }}"
          gh release create $tag $installer.FullName --target "${{ github.sha }}" --title "PulseForge Windows Preview #${{ github.run_number }}" --notes "Unofficial Windows 11 preview build from the original PulseForge fork. Unsigned installer; test lyric sync, spectrum and MP4 export before production use." --prerelease
