name: Build PulseForge Portable Windows ZIP

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Generate Windows icons from original logo
        working-directory: app
        run: npm run tauri -- icon ../icon.png

      - name: Prepare portable FFmpeg tools
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey FFmpeg install failed." }
          $binDir = "app/src-tauri/bin"
          New-Item -Path $binDir -ItemType Directory -Force | Out-Null
          foreach ($tool in @("ffmpeg", "ffprobe")) {
            $item = Get-ChildItem -Path "$env:ChocolateyInstall\lib" -Filter "$tool.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $item) { throw "Cannot find $tool.exe after installation." }
            Copy-Item -LiteralPath $item.FullName -Destination "$binDir/$tool-x86_64-pc-windows-msvc.exe" -Force
            & "$binDir/$tool-x86_64-pc-windows-msvc.exe" -version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "Bundled $tool.exe failed version check." }
          }

      - name: Build raw PulseForge EXE without installer
        working-directory: app
        run: npm run tauri -- build --no-bundle

      - name: Create and inspect multi-file portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-Portable-Windows11-x64
          path: portable-dist/PulseForge-Portable-Windows11-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish portable ZIP to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "portable-dist/PulseForge-Portable-Windows11-x64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Portable ZIP not found." }
          $tag = "windows-portable-preview-${{ github.run_number }}"
          gh release create $tag $zip --target "${{ github.sha }}" --title "PulseForge Portable Windows 11 #${{ github.run_number }}" --notes "Portable multi-file ZIP (no installer). Extract all files, run START_PULSEFORGE.cmd. Includes PulseForge.exe, FFmpeg tools, local-data launcher, notices, checksums. Unsigned preview; Windows 11 WebView2 Runtime required." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish portable preview release." }
